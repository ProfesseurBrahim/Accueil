<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>M. Brahim - Mathématiques</title>
<link rel="icon" type="image/png" href="logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
  }

  .fond-page {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url('Fond.jpg');
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Conteneur de l'image centrale : garde toujours le même ratio que l'image
     (2166 x 2072), donc rien n'est jamais déformé, quelle que soit la taille
     de l'écran. */
  .image-centrale {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 92vmin;
    aspect-ratio: 2166 / 2072;
    max-width: 95vw;
    max-height: 95vh;
  }

  .image-centrale img {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  /* Liens invisibles positionnés exactement sur chaque cercle de l'image,
     en pourcentage du conteneur (donc toujours alignés, même si la taille
     change). */
  .niveau {
    position: absolute;
    width: 16%;
    height: 16.7%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: block;
  }

  /* Décommente la ligne ci-dessous pour visualiser les zones cliquables pendant les réglages */
  /* .niveau { outline: 2px dashed red; } */

  #lien-6eme { left: 44.6%; top: 9.6%; }
  #lien-5eme { left: 24.0%; top: 17.2%; }
  #lien-4eme { left: 12.4%; top: 35.0%; }
  #lien-3eme { left: 9.4%;  top: 55.6%; }
  #lien-snt  { left: 62.9%; top: 88.6%; }
  #lien-2nde { left: 79.8%; top: 76.6%; }
  #lien-1ere { left: 89.2%; top: 56.5%; }
  #lien-term { left: 87.4%; top: 36.4%; }

</style>
</head>
<body>

<div class="fond-page">

  <div class="image-centrale">
    <img src="page_garde.png" alt="M. Brahim - Mathématiques">

    <a href="https://professeurbrahim.github.io/6eme/"  id="lien-6eme"  class="niveau" aria-label="6ème"></a>
    <a href="https://professeurbrahim.github.io/5eme/"  id="lien-5eme"  class="niveau" aria-label="5ème"></a>
    <a href="https://professeurbrahim.github.io/4eme/"  id="lien-4eme"  class="niveau" aria-label="4ème"></a>
    <a href="https://professeurbrahim.github.io/3eme/"  id="lien-3eme"  class="niveau" aria-label="3ème"></a>
    <a href="https://professeurbrahim.github.io/snt/"   id="lien-snt"   class="niveau" aria-label="SNT"></a>
    <a href="https://professeurbrahim.github.io/2nde/"  id="lien-2nde"  class="niveau" aria-label="2nde"></a>
    <a href="https://professeurbrahim.github.io/1ere/"  id="lien-1ere"  class="niveau" aria-label="1ère"></a>
    <a href="https://professeurbrahim.github.io/term/"  id="lien-term"  class="niveau" aria-label="Term"></a>
  </div>

</div>

</body>
</html>
