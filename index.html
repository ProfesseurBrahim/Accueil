<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .fond-page {
    position: relative;
    width: 100%;
    max-width: 1224px;
    margin: 0 auto;
    aspect-ratio: 1224 / 864;
    background-image: url('Fond.jpg');
    background-size: cover;
    background-position: center;
  }

  .niveau-lien {
    position: absolute;
    /* le cercle devient une zone cliquable ronde */
    border-radius: 50%;
    cursor: pointer;
    /* décommentez la ligne suivante pour visualiser les zones pendant les tests */
    /* background: rgba(255,0,0,0.3); */
  }

  /* Chaque cercle : position en % (left/top = coin haut-gauche, width/height = taille) */

  #lien-6eme   { left: 40.6%; top: 6.5%;  width: 9.3%; height: 13.2%; }
  #lien-5eme   { left: 26.8%; top: 16.8%; width: 9.3%; height: 13.2%; }
  #lien-4eme   { left: 20.6%; top: 34.5%; width: 9.3%; height: 13.2%; }
  #lien-3eme   { left: 22.4%; top: 53.7%; width: 9.3%; height: 13.2%; }
  #lien-snt    { left: 50.7%; top: 79.5%; width: 9.3%; height: 13.2%; }
  #lien-2nde   { left: 65.7%; top: 68.5%; width: 9.3%; height: 13.2%; }
  #lien-1ere   { left: 73.7%; top: 49.6%; width: 9.3%; height: 13.2%; }
  #lien-term   { left: 71.9%; top: 24.9%; width: 9.3%; height: 13.2%; }

</style>
</head>
<body>

<div class="fond-page">
  <a href="https://professeurbrahim.github.io/6eme/"  id="lien-6eme"  class="niveau-lien" aria-label="6ème"></a>

  <a href="https://professeurbrahim.github.io/4eme/"  id="lien-4eme"  class="niveau-lien" aria-label="4ème"></a>

  <a href="https://professeurbrahim.github.io/snt/"   id="lien-snt"   class="niveau-lien" aria-label="SNT"></a>
