<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>M. Brahim - Mathématiques</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* Calque de fond flouté qui remplit tout l'écran (utile si le format
     de l'écran ne correspond pas exactement au 16:9 de l'image) */
  .fond-flou {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('Fond.jpg');
    background-size: cover;
    background-position: center;
    filter: blur(30px) brightness(0.9);
    transform: scale(1.15);
    z-index: 0;
  }

  /* Conteneur qui affiche l'image ENTIÈRE, sans rognage, centrée à l'écran */
  .fond-page {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: calc(100vw * 768 / 1376);
    max-height: 100vh;
    max-width: calc(100vh * 1376 / 768);
    transform: translate(-50%, -50%);
    background-image: url('Fond.jpg');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 1;
  }

  .niveau-lien {
    position: absolute;
    z-index: 2;
    border-radius: 50%;
    cursor: pointer;
    /* décommentez pour visualiser les zones cliquables pendant les tests */
    /* background: rgba(255,0,0,0.3); */
  }

  /* Positions en % calculées sur l'image 1376x768 */

  #lien-6eme { left: 41.28%; top: 3.65%;  width: 10.17%; height: 18.23%; }
  #lien-5eme { left: 31.03%; top: 14.06%; width: 10.17%; height: 18.23%; }
  #lien-4eme { left: 25.44%; top: 32.55%; width: 10.17%; height: 18.23%; }
  #lien-3eme { left: 26.74%; top: 54.82%; width: 10.17%; height: 18.23%; }
  #lien-snt  { left: 48.55%; top: 79.17%; width: 10.17%; height: 18.23%; }
  #lien-2nde { left: 60.47%; top: 67.97%; width: 10.17%; height: 18.23%; }
  #lien-1ere { left: 65.77%; top: 47.92%; width: 10.17%; height: 18.23%; }
  #lien-term { left: 64.10%; top: 23.05%; width: 10.17%; height: 18.23%; }

</style>
</head>
<body>

<div class="fond-flou"></div>

<div class="fond-page">
  <a href="https://professeurbrahim.github.io/6eme/"  id="lien-6eme"  class="niveau-lien" aria-label="6ème"></a>
  <a href="https://professeurbrahim.github.io/5eme/"  id="lien-5eme"  class="niveau-lien" aria-label="5ème"></a>
  <a href="https://professeurbrahim.github.io/4eme/"  id="lien-4eme"  class="niveau-lien" aria-label="4ème"></a>
  <a href="https://professeurbrahim.github.io/3eme/"  id="lien-3eme"  class="niveau-lien" aria-label="3ème"></a>
  <a href="https://professeurbrahim.github.io/snt/"   id="lien-snt"   class="niveau-lien" aria-label="SNT"></a>
  <a href="https://professeurbrahim.github.io/2nde/"  id="lien-2nde"  class="niveau-lien" aria-label="2nde"></a>
  <a href="https://professeurbrahim.github.io/1ere/"  id="lien-1ere"  class="niveau-lien" aria-label="1ère"></a>
  <a href="https://professeurbrahim.github.io/term/"  id="lien-term"  class="niveau-lien" aria-label="Terminale"></a>
</div>

</body>
</html>
