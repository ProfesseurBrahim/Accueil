<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>M. Brahim - Mathématiques</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* Calque de fond flouté qui remplit tout l'écran */
  .fond-flou {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('Fond.jpg');
    background-size: cover;
    background-position: center;
    filter: blur(30px) brightness(0.9);
    transform: scale(1.15); /* évite de voir les bords nets du blur */
    z-index: 0;
  }

  /* Conteneur qui affiche l'image ENTIÈRE, sans rognage, centrée */
  .fond-page {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: calc(100vw * 864 / 1224);
    max-height: 100vh;
    max-width: calc(100vh * 1224 / 864);
    transform: translate(-50%, -50%);
    background-image: url('Fond.jpg');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 1;
  }

  .niveau-lien {
    position: absolute;
    z-index: 2;
    /* le cercle devient une zone cliquable ronde */
    border-radius: 50%;
    cursor: pointer;
    /* décommentez la ligne suivante pour visualiser les zones pendant les tests */
    /* background: rgba(255,0,0,0.3); */
  }

  /* Chaque cercle : position en % (left/top = coin haut-gauche, width/height = taille) */

  #lien-6eme   { left: 40.6%; top: 6.5%;  width: 9.3%; height: 13.2%; }
  #lien-5eme   { left: 26.8%; top: 16.8%; width: 9.3%; height: 13.2%; }
  #lien-4eme   { left: 20.6%; top: 34.5%; width: 9.3%; height: 13.2%; }
  #lien-3eme   { left: 22.4%; top: 53.7%; width: 9.3%; height: 13.2%; }
  #lien-snt    { left: 50.7%; top: 79.5%; width: 9.3%; height: 13.2%; }
  #lien-2nde   { left: 65.7%; top: 68.5%; width: 9.3%; height: 13.2%; }
  #lien-1ere   { left: 73.7%; top: 49.6%; width: 9.3%; height: 13.2%; }
  #lien-term   { left: 71.9%; top: 24.9%; width: 9.3%; height: 13.2%; }

</style>
</head>
<body>

<div class="fond-flou"></div>

<div class="fond-page">
  <a href="https://professeurbrahim.github.io/6eme/"  id="lien-6eme"  class="niveau-lien" aria-label="6ème"></a>
  <a href="https://professeurbrahim.github.io/5eme/"  id="lien-5eme"  class="niveau-lien" aria-label="5ème"></a>
  <a href="https://professeurbrahim.github.io/4eme/"  id="lien-4eme"  class="niveau-lien" aria-label="4ème"></a>
  <a href="https://professeurbrahim.github.io/3eme/"  id="lien-3eme"  class="niveau-lien" aria-label="3ème"></a>
  <a href="https://professeurbrahim.github.io/snt/"   id="lien-snt"   class="niveau-lien" aria-label="SNT"></a>
  <a href="https://professeurbrahim.github.io/2nde/"  id="lien-2nde"  class="niveau-lien" aria-label="2nde"></a>
  <a href="https://professeurbrahim.github.io/1ere/"  id="lien-1ere"  class="niveau-lien" aria-label="1ère"></a>
  <a href="https://professeurbrahim.github.io/term/"  id="lien-term"  class="niveau-lien" aria-label="Terminale"></a>
</div>

</body>
</html>
